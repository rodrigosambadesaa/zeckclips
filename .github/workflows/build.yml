# Genera los instaladores de ZeckClips para Windows, macOS (Intel y Apple Silicon) y Linux.
# El proyecto está en APP/. PRs y cambios de versión en main generan artefactos de prueba.
# Solo una etiqueta v* (p. ej. v1.0.3) publica una release; workflow_dispatch solo genera artefactos.
name: Instaladores

on:
  push:
    branches: [main]
    paths: [APP/package.json, .github/workflows/build.yml]
    tags: ["v*"]
  pull_request:
    paths: ["APP/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: APP

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-24.04
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: APP/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node --check main.js
      - run: node --check security.js
      - run: node --check scripts/fetch-bins.mjs
      - run: node --check scripts/verified-binaries.mjs
      - run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ZeckClips-${{ runner.os }}
          path: |
            APP/dist/*.dmg
            APP/dist/*.zip
            APP/dist/*.exe
            APP/dist/*.AppImage
            APP/dist/*.deb
          if-no-files-found: error

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZeckClips ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ github.workspace }}/out/*
