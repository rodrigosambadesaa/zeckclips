name: Security regression tests

on:
  push:
    branches: [main, "security/**", "fix/**"]
    paths:
      - "APP/**"
      - ".github/workflows/security-tests.yml"
  pull_request:
    paths:
      - "APP/**"
      - ".github/workflows/security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js security regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node --check security.js
      - run: node --check server.js
      - run: node --check main.js
      - run: node --check scripts/fetch-bins.mjs
      - run: node --check scripts/verified-binaries.mjs
